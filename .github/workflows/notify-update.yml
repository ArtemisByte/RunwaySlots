name: Runway Slots Update Notification

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Firebase Admin
        run: npm install firebase-admin --no-save

      - name: Publish deployment version
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          COMMIT_SHA: ${{ github.sha }}

        run: |
          node <<'EOF'

          const { initializeApp, cert } = require("firebase-admin/app");
          const { getDatabase, ServerValue } = require("firebase-admin/database");

          async function main() {
            const serviceAccount =
              JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);

            initializeApp({
              credential: cert(serviceAccount),
              databaseURL: process.env.FIREBASE_DATABASE_URL
            });

            const commit = process.env.COMMIT_SHA;

            const deployment = {
              version: commit,
              shortVersion: commit.substring(0, 7),
              deployedAt: ServerValue.TIMESTAMP,
              message: "A new version of Runway Slots has been deployed."
            };

            await getDatabase()
              .ref("siteStatus/deployment")
              .set(deployment);

            console.log(
              "Published Runway Slots deployment:",
              deployment.shortVersion
            );
          }

          main()
            .then(() => process.exit(0))
            .catch(error => {
              console.error(error);
              process.exit(1);
            });

          EOF
